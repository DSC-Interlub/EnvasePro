<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TV da fábrica</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',sans-serif;color:#fff;background:#0A0F1F;-webkit-font-smoothing:antialiased}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:754}to{stroke-dashoffset:113}}
.arc{animation:draw 2s cubic-bezier(.2,.8,.2,1) .4s both}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,214,140,.6)}100%{box-shadow:0 0 0 18px rgba(61,214,140,0)}}
.live{animation:pulse 2s ease-out infinite}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,30px)}100%{transform:translate(0,0)}}
.glow{animation:drift 14s ease-in-out infinite}
</style>
</helmet>
<div style="position:relative;width:1920px;height:1080px;box-sizing:border-box;background:#0A0F1F;overflow:hidden;display:flex;flex-direction:column;padding:56px 72px 52px;gap:36px">

  <div class="glow" style="position:absolute;left:-200px;top:-260px;width:900px;height:900px;border-radius:450px;background:radial-gradient(closest-side,rgba(59,91,255,.32),rgba(59,91,255,0))"></div>
  <div class="glow" style="position:absolute;right:-240px;bottom:-320px;width:1000px;height:1000px;border-radius:500px;background:radial-gradient(closest-side,rgba(61,214,140,.16),rgba(61,214,140,0))"></div>

  <header style="position:relative;display:flex;align-items:center;justify-content:space-between;flex:none">
    <div style="display:flex;align-items:center;gap:24px">
      <div style="width:84px;height:84px;border-radius:26px;background:#fff;color:#0A0F1F;font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center">EP</div>
      <div>
        <div style="display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:#9AA7D0"><span class="live" style="width:16px;height:16px;border-radius:8px;background:#3DD68C"></span>Ao vivo · Envase · turno [TURNO]</div>
        <div style="font-size:66px;font-weight:800;letter-spacing:-.03em;line-height:1.1">Produção de hoje</div>
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-size:104px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums">14:32</div>
      <div style="font-size:26px;font-weight:700;color:#9AA7D0">Quarta-feira</div>
    </div>
  </header>

  <div style="position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:28px">
    <div class="in" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:40px;padding:40px 48px;display:flex;align-items:center;gap:40px">
      <svg role="img" aria-label="128 de 150 envases, 85 por cento da meta" width="300" height="300" viewBox="0 0 300 300" style="flex:none">
        <circle cx="150" cy="150" r="120" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="26"/>
        <circle class="arc" cx="150" cy="150" r="120" fill="none" stroke="#5B7BFF" stroke-width="26" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="113" transform="rotate(-90 150 150)"/>
        <text x="150" y="168" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="72" fill="#fff">85%</text>
      </svg>
      <div>
        <div style="font-size:30px;font-weight:700;color:#9AA7D0">Envases</div>
        <div style="font-size:200px;font-weight:800;letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums">128</div>
        <div style="font-size:30px;font-weight:600;color:#C7CFEA">meta 150 · faltam <b style="color:#fff">22</b></div>
      </div>
    </div>

    <div class="in" style="animation-delay:.15s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:40px;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-size:30px;font-weight:700;color:#9AA7D0">Esperando assinatura</div>
      <div style="font-size:240px;font-weight:800;letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums">7</div>
      <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:rgba(255,193,71,.16);color:#FFC247;border-radius:999px;padding:12px 26px;font-size:28px;font-weight:800">▲ 2 a mais que ontem</div>
    </div>

    <div class="in" style="animation-delay:.3s;background:rgba(255,255,255,.06);border:1px solid rgba(255,107,112,.5);border-radius:40px;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between">
      <div style="font-size:30px;font-weight:700;color:#9AA7D0">Ocorrências abertas</div>
      <div style="font-size:240px;font-weight:800;letter-spacing:-.05em;line-height:.95;color:#FF7B80;font-variant-numeric:tabular-nums">2</div>
      <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:rgba(255,107,112,.18);color:#FF9A9E;border-radius:999px;padding:12px 26px;font-size:28px;font-weight:800">1 há mais de 24 h</div>
    </div>
  </div>

  <footer style="position:relative;flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px">
    <div class="in" style="animation-delay:.45s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:26px 30px;display:flex;align-items:center;gap:20px"><span style="width:18px;height:18px;border-radius:9px;background:#3DD68C;flex:none"></span><div><div style="font-size:38px;font-weight:800">Linha 1</div><div style="font-size:24px;font-weight:600;color:#9AA7D0">Operando</div></div></div>
    <div class="in" style="animation-delay:.5s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:26px 30px;display:flex;align-items:center;gap:20px"><span style="width:18px;height:18px;border-radius:9px;background:#3DD68C;flex:none"></span><div><div style="font-size:38px;font-weight:800">Linha 2</div><div style="font-size:24px;font-weight:600;color:#9AA7D0">Operando</div></div></div>
    <div class="in" style="animation-delay:.55s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:26px 30px;display:flex;align-items:center;gap:20px"><span style="width:18px;height:18px;border-radius:9px;background:#FFC247;flex:none"></span><div><div style="font-size:38px;font-weight:800">Empilhadeira</div><div style="font-size:24px;font-weight:600;color:#9AA7D0">Manutenção em 5 dias</div></div></div>
    <div class="in" style="animation-delay:.6s;background:rgba(255,255,255,.06);border:1px solid rgba(255,107,112,.5);border-radius:28px;padding:26px 30px;display:flex;align-items:center;gap:20px"><span style="width:18px;height:18px;border-radius:9px;background:#FF6B70;flex:none"></span><div><div style="font-size:38px;font-weight:800">Limpeza</div><div style="font-size:24px;font-weight:600;color:#9AA7D0">1 sala atrasada</div></div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
