<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo registro — tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',sans-serif;color:#141A2B;background:#F3F4F8;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;transition:transform .15s ease,box-shadow .25s ease,background-color .2s ease,border-color .2s ease,color .2s ease,opacity .2s ease}
button:active{transform:scale(.96)}
.nav:hover{background:#EEF1FF;color:#3B5BFF}
.key:hover{background:#fff;box-shadow:0 6px 16px rgba(20,26,43,.1)}
.pack:hover{border-color:#3B5BFF}
.rec:hover{background:#F3F4F8}
.cta:hover{box-shadow:0 14px 30px rgba(59,91,255,.4);transform:translateY(-2px)}
.search{transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:#3B5BFF;box-shadow:0 0 0 4px rgba(59,91,255,.14)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
</style>
</helmet>
<div style="position:relative;width:1180px;height:820px;box-sizing:border-box;display:flex;gap:16px;padding:16px;background:#F3F4F8;overflow:hidden">

  <div style="position:absolute;left:50%;top:22px;z-index:5;display:flex;align-items:center;gap:12px;background:#141A2B;color:#fff;padding:12px 20px 12px 14px;border-radius:16px;box-shadow:0 18px 40px rgba(20,26,43,.3);font-weight:700;font-size:16px;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1.2);opacity:{{toastO}};transform:translateX(-50%) translateY({{toastY}}px)">
    <span style="width:30px;height:30px;border-radius:15px;background:#12A66B;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
    Envase registrado
  </div>

  <nav aria-label="Principal" style="width:80px;flex:none;background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(20,26,43,.05),0 10px 30px rgba(20,26,43,.05);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px">
    <div style="width:46px;height:46px;border-radius:14px;background:#141A2B;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;margin-bottom:14px">EP</div>
    <button class="nav" aria-label="Painel" style="width:52px;height:52px;border:0;background:transparent;color:#7A8296;border-radius:16px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></button>
    <button aria-label="Envase" aria-current="page" style="width:52px;height:52px;border:0;background:#3B5BFF;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(59,91,255,.4)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav" aria-label="Registros" style="width:52px;height:52px;border:0;background:transparent;color:#7A8296;border-radius:16px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="nav" aria-label="Check-out" style="width:52px;height:52px;border:0;background:transparent;color:#7A8296;border-radius:16px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg></button>
    <button class="nav" aria-label="Empilhadeira" style="width:52px;height:52px;border:0;background:transparent;color:#7A8296;border-radius:16px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7h8v10M12 11h4l3 3v3H4"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg></button>
    <button class="nav" aria-label="Recebimento" style="width:52px;height:52px;border:0;background:transparent;color:#7A8296;border-radius:16px;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg></button>
  </nav>

  <main style="flex:1;min-width:0;display:flex;flex-direction:column;gap:16px">
    <header class="in" style="display:flex;align-items:center;justify-content:space-between;height:56px;flex:none;padding:0 4px">
      <div>
        <div style="font-size:13px;font-weight:600;color:#7A8296">Envase <span style="margin:0 6px">/</span> Linha 1</div>
        <h1 style="margin:2px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em">Novo registro</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(20,26,43,.06)"><span style="width:8px;height:8px;border-radius:4px;background:#12A66B"></span>Turno [TURNO]</span>
        <button aria-label="Trocar operador" style="display:inline-flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:999px;padding:6px 16px 6px 6px;font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(20,26,43,.06)"><span style="width:36px;height:36px;border-radius:18px;background:#E3E8FF;color:#3B5BFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">OP</span>[Operador]</button>
      </div>
    </header>

    <div style="flex:1;min-height:0;display:flex;gap:16px">
      <section class="in" style="animation-delay:.08s;flex:1;min-width:0;background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(20,26,43,.05),0 10px 30px rgba(20,26,43,.05);padding:22px;display:flex;flex-direction:column;gap:18px">
        <label class="search" style="display:flex;align-items:center;gap:12px;background:#F3F4F8;border:2px solid transparent;border-radius:16px;padding:0 10px 0 18px;height:60px;box-sizing:border-box">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A8296" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar produto</span>
          <input placeholder="Buscar por nome ou código" style="flex:1;border:0;outline:0;background:transparent;font-family:'Manrope',sans-serif;font-size:17px;font-weight:600;height:52px;color:#141A2B">
          <button style="height:44px;padding:0 16px;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(20,26,43,.12);font-weight:700;font-size:14px;color:#141A2B;display:flex;align-items:center;gap:8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14M21 5v14"/></svg>Ler código</button>
        </label>

        <div style="background:#F0F3FF;border:2px solid #3B5BFF;border-radius:20px;padding:18px 20px;display:flex;gap:16px;align-items:center">
          <div style="width:64px;height:64px;border-radius:18px;background:#fff;color:#3B5BFF;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(59,91,255,.18)"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg></div>
          <div style="flex:1;min-width:0">
            <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#5A6AA8">IVP050211010</div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px">Intergrease LC N 2</div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <span style="background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700">Unidade KG</span>
              <span style="background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700">Consistência 2</span>
            </div>
          </div>
          <span style="width:32px;height:32px;border-radius:16px;background:#3B5BFF;display:flex;align-items:center;justify-content:center;flex:none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
        </div>

        <div>
          <div style="font-size:13px;font-weight:700;color:#7A8296;margin-bottom:10px">Embalagem</div>
          <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
            <sc-for list="{{packs}}" as="p" hint-placeholder-count="4">
              <button class="pack" onClick="{{p.press}}" style="height:64px;border-radius:16px;font-size:16px;font-weight:700;background:{{p.bg}};color:{{p.fg}};border:2px solid {{p.bd}};box-shadow:{{p.sh}}">{{p.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="flex:1;min-height:0">
          <div style="font-size:13px;font-weight:700;color:#7A8296;margin-bottom:8px">Usados há pouco</div>
          <button class="rec" style="width:100%;height:56px;border:0;background:transparent;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px;font-weight:700;color:#141A2B"><span>Black Chain Light</span><span style="font-size:13px;color:#7A8296;font-weight:600">Usar →</span></button>
          <button class="rec" style="width:100%;height:56px;border:0;background:transparent;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px;font-weight:700;color:#141A2B"><span>Black Chain Plus</span><span style="font-size:13px;color:#7A8296;font-weight:600">Usar →</span></button>
        </div>
      </section>

      <section class="in" style="animation-delay:.16s;width:392px;flex:none;background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(20,26,43,.05),0 10px 30px rgba(20,26,43,.05);padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
        <div style="font-size:13px;font-weight:700;color:#7A8296">Quantidade</div>
        <div style="background:#F3F4F8;border-radius:20px;height:112px;display:flex;align-items:baseline;justify-content:flex-end;gap:10px;padding:0 24px;align-items:center">
          <span style="font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:{{qtyColor}};transition:color .2s">{{qtyText}}</span>
          <span style="font-size:20px;font-weight:700;color:#7A8296;padding-top:30px">un</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
          <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
            <button class="key" aria-label="{{k.label}}" onClick="{{k.press}}" style="height:64px;border:0;border-radius:18px;background:#F3F4F8;font-size:26px;font-weight:700;color:#141A2B">{{k.t}}</button>
          </sc-for>
        </div>
        <button class="cta" onClick="{{register}}" style="margin-top:4px;height:72px;border:0;border-radius:20px;background:{{ctaBg}};color:{{ctaFg}};font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:{{ctaSh}}">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>Registrar envase
        </button>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const qty = s.qty || '';
    const pack = s.pack || 'balde';
    const toast = !!s.toast;
    const press = (t) => () => {
      const cur = (this.state && this.state.qty) || '';
      let q = cur;
      if (t === 'C') q = '';
      else if (t === '←') q = cur.slice(0, -1);
      else if (cur.length < 5) q = (cur === '0' ? '' : cur) + t;
      this.setState({ qty: q });
    };
    const labels = { 'C': 'Limpar', '←': 'Apagar' };
    const keys = ['1','2','3','4','5','6','7','8','9','C','0','←'].map((t) => ({ t, label: labels[t] || t, press: press(t) }));
    const packs = [['balde','Balde'],['tambor','Tambor'],['bombona','Bombona'],['outra','Outra']].map(([id, label]) => {
      const on = pack === id;
      return { label, bg: on ? '#F0F3FF' : '#fff', fg: on ? '#3B5BFF' : '#141A2B', bd: on ? '#3B5BFF' : '#E6E8EF', sh: on ? '0 6px 16px rgba(59,91,255,.18)' : 'none', press: () => this.setState({ pack: id }) };
    });
    const ready = qty.length > 0;
    const register = () => {
      if (!((this.state && this.state.qty) || '').length) return;
      this.setState({ qty: '', toast: true });
      setTimeout(() => this.setState({ toast: false }), 2400);
    };
    return {
      keys, packs, register,
      qtyText: ready ? qty : '0',
      qtyColor: ready ? '#141A2B' : '#B8BECC',
      ctaBg: ready ? '#3B5BFF' : '#D9DDF0',
      ctaFg: ready ? '#fff' : '#8A92B2',
      ctaSh: ready ? '0 10px 24px rgba(59,91,255,.34)' : 'none',
      toastO: toast ? 1 : 0,
      toastY: toast ? 0 : -28
    };
  }
}
</script>
</body>
</html>
